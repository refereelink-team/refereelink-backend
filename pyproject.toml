[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refereelink-backend"
version = "0.2.0"
description = "RefereeLink real-time analysis and assisted officiating backend"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SC Team" }]
dependencies = [
    "fastapi>=0.110",
    "gdown>=5.1",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "protobuf>=4.25",
    "psutil>=5.9",
    "sentencepiece>=0.2",
    "supervision>=0.25",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
    "ultralytics>=8.3",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
desktop = [
    "PySide6==6.10.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pyright>=1.1.390",
    "jsonschema>=4.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/refereelink-team/refereelink-backend"

[tool.setuptools.packages.find]
include = ["app", "app.*", "experiments", "experiments.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["assets", "web/node_modules", "web/dist"]

[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"

[tool.uv]
default-groups = ["dev"]
